name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed GitHub Release for the app version
        type: boolean
        default: false

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The runner image may not ship platform 36 yet; AGP downloads missing
      # SDK components automatically when licenses are pre-accepted.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      # The Rust `logic` library ships prebuilt in logic/src/main/jniLibs, so
      # the APK build itself needs no NDK / Rust toolchain on CI. Building it
      # from rust/ is covered by rust.yml.
      #
      # Signing: the release keystore/passwords live in repo secrets (push
      # and manual builds only; PRs stay unsigned,
      # which is fine for a build-check).
      - name: Inject release signing (push and manual builds only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.LUMA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LUMA_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LUMA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          cat > app/release-keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=luma
          keyPassword=$KEY_PASS
          EOF

      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed release APK
        id: release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          VERSION="$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          VERSION_CODE="$(jq -er '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APK="app/build/outputs/apk/release/LumaGA_${VERSION}.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "versionCode='$VERSION_CODE' versionName='$VERSION'"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          # Push and manual builds upload the signed APK; PR builds produce
          # the unsigned one. Match either.
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download verified APK and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh run download "$RUN_ID" --name app-release --dir release
          APK="release/LumaGA_${VERSION}.apk"
          test -f "$APK"
          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { insec = 1; next }
            insec && $0 ~ /^## \[/ { exit }
            insec { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "v$VERSION" --target "$RELEASE_SHA" \
            --title "LumaGA v$VERSION" "${NOTES_ARGS[@]}" "$APK"
